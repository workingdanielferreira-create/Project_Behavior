<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Behavior V3</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<!-- The whole window is the game: WebGL canvas, HUD on top, menus on top of that. -->
<div class="game" id="game" tabindex="0" aria-label="Project Behavior V3">
  <canvas id="gl"></canvas>
  <div class="hud" id="hud">
    <div class="labels" id="labels"></div>
    <div class="teams">
      <div class="tm"><div class="nm"><span id="n0">—</span><small id="h0t"></small></div><div class="hpb"><i id="h0" style="background:#ff3b55"></i></div><div class="bench" id="b0"></div></div>
      <div class="dir"><span class="ph" id="dph">CALM</span><div class="bar"><i id="dbar"></i><u id="dmark"></u></div></div>
      <div class="tm r"><div class="nm"><small id="h1t"></small><span id="n1">—</span></div><div class="hpb"><i id="h1" style="background:#a98cff"></i></div><div class="bench" id="b1"></div></div>
    </div>
    <div class="trn" id="trn"></div>
    <div class="callout" id="callout"><b></b><span></span></div>
    <div class="cmdbar" id="cmdbar"></div>
    <div class="feel" id="feel"></div>
    <div class="vig" id="vig"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="menu" id="menu" hidden></div>
</div>

<!-- Load order matters: each file may use what the files above it declare. -->
<script src="lib/three.min.js"></script>
<script src="data/world.gen.js"></script> <!-- world settings (characters/world3d.json, World Studio 3D), packed by tools/build_kits.py -->
<script src="js/world3d.js"></script>    <!-- the little planet: settings, globe bend, environment, destructibles (shared with World Studio 3D) -->
<script src="js/core.js"></script>       <!-- constants, maths helpers -->
<script src="js/settings.js"></script>   <!-- saved settings -->
<script src="js/kits.js"></script>       <!-- stand-in kits (used only if data/kits.gen.js is missing) -->
<script src="data/kits.gen.js"></script> <!-- real kits, packed from characters/ by tools/build_kits.py (run_v3.bat) -->
<script src="data/body.gen.js"></script> <!-- the shared .glb body + each kit's clips, packed by tools/build_kits.py (run_v3.bat) -->
<script src="lib/GLTFLoader.js"></script>
<!-- FX Studio's own 2D FX runtime, loaded unchanged from tools/fx/studio -->
<script src="../tools/fx/studio/fxkit.js"></script>
<script src="../tools/fx/studio/swordfx.js"></script>
<script src="../tools/fx/studio/hitfx.js"></script>
<script src="../tools/fx/studio/strikefx.js"></script>
<script src="../tools/fx/studio/kickfx.js"></script>
<script src="../tools/fx/studio/powerfx.js"></script>
<script src="../tools/fx/studio/gunfx.js"></script>
<script src="../tools/fx/studio/weaponfx.js"></script>
<script src="../tools/fx/studio/crescentfx.js"></script>
<script src="../tools/fx/studio/slashline.js"></script>
<script src="../tools/fx/studio/defendfx.js"></script>
<script src="../tools/fx/studio/hyperfx.js"></script>   <!-- punching FX + impact FX (V3, Daniel 2026-11-26) -->
<script src="js/conds3d.js"></script>    <!-- action trigger conditions: the catalogue (FX Studio types + 3D ones), shared with FX Studio 3D -->
<script src="js/realkits.js"></script>
<script src="js/forms3d.js"></script>    <!-- transformations: forms step up on the transform action / G key, stats, in_forms, form clips -->   <!-- real kits -> V3 kits (actions, triggers, dodge, movement) -->
<script src="js/renderer.js"></script>   <!-- WebGL renderer, scene, materials, 2D->3D mapping -->
<script src="js/arena.js"></script>      <!-- arena / environment -->
<script src="js/planet.js"></script>     <!-- planet in the fight: globe roll, destructibles, gravity numbers -->
<script src="js/fx.js"></script>         <!-- FX design: primitives (slash, ring, sparks, dust ...) -->
<script src="js/state.js"></script>      <!-- world state, timers -->
<script src="js/keytween.js"></script>   <!-- key poses + eases -> the in-between frames (tweening) -->
<script src="js/retarget.js"></script>   <!-- clip retargeting onto whatever humanoid body is loaded -->
<script src="js/weapons3d.js"></script>  <!-- weapons built in Rig Forge 3D's weapon editor -->
<script src="js/glbody.js"></script>     <!-- .glb fighter body: load, per-fighter copy, clip picking -->
<script src="js/models.js"></script>     <!-- fighter rigs and models -->
<script src="js/movestyle.js"></script>  <!-- movement styles -->
<script src="js/tempo.js"></script>      <!-- fight rhythm intents (port of laser/tempo.py) -->
<script src="js/director.js"></script>   <!-- director: calm / build / burst -->
<script src="js/motion.js"></script>     <!-- drift & snap motion -->
<script src="js/sprint.js"></script>     <!-- continuous movement, sprint levels Lv1 / Lv2 / Lv3 (Shift) -->
<script src="js/gravity.js"></script>    <!-- jumps, double jumps, fast fall; flight for flyers -->
<script src="js/combat.js"></script>     <!-- actions, hits, damage, reactions, tagging, shots -->
<script src="js/parry.js"></script>      <!-- parry / deflect (Ctrl+Space + AI) -->
<script src="js/combo.js"></script>     <!-- knockback combos (juggle, redirect, decay + cap, auto chase) + lock-on -->
<script src="js/fx3d.js"></script>       <!-- FX 3D runtime: 2D FX laid on cards in 3D, 3D anchors, hits, move3d (shared with FX Studio 3D) -->
<script src="js/fxlive.js"></script>     <!-- real kits' FX + 3D action movement in the fight -->
<script src="js/fxlib.js"></script>      <!-- FX animation: every action effect -->
<script src="js/fighter.js"></script>    <!-- per-fighter update, altitude -->
<script src="js/training.js"></script>   <!-- training mode: one fighter + dummies -->
<script src="js/input.js"></script>      <!-- keyboard commands -->
<script src="js/camera.js"></script>     <!-- camera modes and cuts -->
<script src="js/cinecam.js"></script>    <!-- cinematic camera (director, spring rig, framing, event / destruction shots) + clear sight lines (move, fade, X-ray) -->
<script src="js/anim.js"></script>       <!-- animation: pose, swing, lean, flashes -->
<script src="js/hud.js"></script>        <!-- HUD, callouts, damage numbers, feel panel -->
<script src="js/menus.js"></script>      <!-- title, teams, settings, controls, pause, results -->
<script src="js/main.js"></script>
<script src="js/worldlive.js"></script>  <!-- live link: World Studio 3D auto-saves characters/world3d.json, the game re-reads it every second and rebuilds the planet -->       <!-- game loop, flow, boot -->
</body>
</html>
