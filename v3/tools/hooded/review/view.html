<!doctype html><html><body style="margin:0;background:#fff">
<script src="../../../lib/three.min.js"></script>
<script src="../../../lib/GLTFLoader.js"></script>
<script src="../../../js/weapons3d.js"></script>
<script src="../../../js/keytween.js"></script>
<script src="out/preview.js"></script>
<script>
const W=520,H=560;
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(W,H);R.setClearColor(0xffffff);document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.add(new THREE.HemisphereLight(0xffffff,0x886644,0.9));const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(-2,4,3);S.add(dl);
const grid=new THREE.GridHelper(8,16,0x999999,0xdddddd);S.add(grid);
const SIL=new THREE.MeshBasicMaterial({color:0x111111,skinning:true,side:THREE.DoubleSide});   // blocking: does the key read in solid black?
const tgt=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.8,12),new THREE.MeshLambertMaterial({color:0xcc2222}));tgt.position.set(0,.9,3.2);S.add(tgt);
const cam=new THREE.PerspectiveCamera(30,W/H,.1,50);
let mixer,action,hips;
const bin=Uint8Array.from(atob(GLB),c=>c.charCodeAt(0)).buffer;
new THREE.GLTFLoader().parse(bin,'',g=>{ktExpandAll(g);const m=g.scene;
  m.traverse(o=>{if(o.isMesh){if(/blade/i.test(o.name)){o.visible=false;return;}
    o.material=new THREE.MeshLambertMaterial({color:/Joints/.test(o.material.name)?0x2a3a6a:0xffb030,skinning:true});o.frustumCulled=false;}
    if(o.name==='Hips')hips=o;});
  S.add(m);mixer=new THREE.AnimationMixer(m);action=mixer.clipAction(g.animations[0]);action.play();
  const grad=null,ink=new THREE.MeshBasicMaterial({color:0x05070d,side:THREE.BackSide});
  pbwAttach(m,WEAPONS,{blade:new THREE.MeshToonMaterial({color:0xe8f4ff}),hilt:new THREE.MeshToonMaterial({color:0x2a2f3c}),ink:null});
  const wait=()=>{let n=0;m.traverse(o=>{if(o.userData&&o.userData.pbw&&o.children.length)n++;});if(n>=2)window.READY=true;else setTimeout(wait,100);};wait();});
window.hideSide=(side,on)=>pbwShow(S,side,on);
window.shot=(t,view,cx,cz,hide)=>{pbwShow(S,'R',!(hide&&hide.R));pbwShow(S,'L',!(hide&&hide.L));action.time=t;mixer.update(0);S.updateMatrixWorld(true);
  const tx=cx||0, tz=cz||0, ty=0.85;
  const sil=view==='sil';S.overrideMaterial=sil?SIL:null;grid.visible=!sil;tgt.visible=!sil&&view!=='front';R.setClearColor(0xffffff);
  if(view==='side'||sil){cam.position.set(tx-5.2,ty+0.3,tz);}
  else if(view==='q34'){cam.position.set(tx-3.4,ty+1.4,tz+3.7);}
  else if(view==='front'){cam.position.set(tx+0.5,ty+0.5,tz+5.2);}
  else if(view==='top'){cam.position.set(tx,ty+8,tz+0.01);}
  cam.lookAt(tx,ty,tz);R.render(S,cam);return R.domElement.toDataURL('image/png');};
window.handShot=(t,bone,dx,dy,dz)=>{action.time=t;mixer.update(0);S.updateMatrixWorld(true);let b;S.traverse(o=>{if(o.name===bone)b=o;});const v=new THREE.Vector3();b.getWorldPosition(v);
  cam.position.set(v.x+dx,v.y+dy,v.z+dz);cam.lookAt(v);R.render(S,cam);return R.domElement.toDataURL('image/png');};
window.hipsAt=(t)=>{action.time=t;mixer.update(0);S.updateMatrixWorld(true);const v=new THREE.Vector3();hips.getWorldPosition(v);return [v.x,v.y,v.z];};
</script></body></html>
